# POFlow — automatic publish · autodeploy v2.0 (ICTSRU/PR)
# Push to main ─┬─ GitHub Pages republishes the ITOC sign-in page (index.html + assets/) — built in
#               └─ this workflow (when apps-script/** changes):
#                    1. version guard  — every edit must carry a NEW version (tools/bump_version.py), same in every file
#                    2. clasp push     — replaces the Apps Script project's code (Code, Demo, Index, HowTo, Logos, CompanyLogo, PdfFont, Denied, I18n, Flow)
#                    3. clasp deploy   — moves the EXISTING web-app deployment to the new version (same /exec URL)
#                    4. Google Sheet   — updated by the app itself on the first visit after the deploy (ensureInstalled_)
# Secrets (Settings ▸ Secrets and variables ▸ Actions): CLASPRC_JSON · SCRIPT_ID · DEPLOYMENT_ID
name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths: ['apps-script/**', 'index.html', 'tools/i18n/**', 'CHANGELOG.md', '.github/workflows/deploy-apps-script.yml']
  workflow_dispatch:

concurrency: apps-script-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SCRIPT_ID: ${{ secrets.SCRIPT_ID || vars.SCRIPT_ID }}
      DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID || vars.DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Version guard (one version in every file · a new version for every edit)
        run: |
          python3 tools/bump_version.py --check
          NEW=$(grep -oP "APP_VERSION\s*=\s*'\K[0-9.]+" apps-script/Code.gs)
          OLD=$(git show HEAD^:apps-script/Code.gs 2>/dev/null | grep -oP "APP_VERSION\s*=\s*'\K[0-9.]+" || echo "")
          echo "previous: ${OLD:-none} · this commit: $NEW"
          if [ -n "$OLD" ] && [ "${{ github.event_name }}" = "push" ] && ! git diff --quiet HEAD^ HEAD -- apps-script; then
            python3 -c "import sys; o,n=[tuple(map(int,x.split('.'))) for x in sys.argv[1:]]; sys.exit(0 if n>o else 1)" "$OLD" "$NEW" \
              || { echo "::error::apps-script changed but the version is still v$NEW (was v$OLD). Run: python3 tools/bump_version.py \"وصف التغيير\""; exit 1; }
          fi
          echo "VER=$NEW" >> "$GITHUB_ENV"

      - name: Translation bundle is up to date (tools/build_i18n.py)
        run: python3 tools/build_i18n.py --check

      - name: Acceptance tests (Code.gs on the Apps Script emulator)
        run: node tests/acceptance.test.js

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install clasp (pinned)
        run: npm install -g @google/clasp@2.4.2

      - name: Credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          miss=""
          [ -n "$CLASPRC_JSON" ]  || miss="$miss CLASPRC_JSON"
          [ -n "$SCRIPT_ID" ]     || miss="$miss SCRIPT_ID"
          [ -n "$DEPLOYMENT_ID" ] || miss="$miss DEPLOYMENT_ID"
          if [ -n "$miss" ]; then echo "::error::Missing repository secret(s):$miss — add them in Settings > Secrets and variables > Actions (exact names)"; exit 1; fi
          echo "$CLASPRC_JSON" | grep -q '"refresh_token"' || { echo "::error::CLASPRC_JSON does not contain refresh_token — paste the whole content of .clasprc.json"; exit 1; }
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Keep the live project's manifest (appsscript.json)
        run: |
          mkdir -p /tmp/live && cd /tmp/live
          printf '{"scriptId":"%s"}' "$SCRIPT_ID" > .clasp.json
          clasp pull
          cp appsscript.json "$GITHUB_WORKSPACE/apps-script/appsscript.json"

      - name: Push code to Apps Script
        working-directory: apps-script
        run: |
          printf '{"scriptId":"%s","rootDir":"."}' "$SCRIPT_ID" > .clasp.json
          clasp push --force

      - name: New version on the same web-app deployment (URL unchanged)
        working-directory: apps-script
        run: |
          clasp deploy -i "$DEPLOYMENT_ID" -d "v$VER · ${GITHUB_SHA::7}"
          {
            echo "### ✅ POFlow v$VER published"
            echo "- Apps Script code updated · web app moved to v$VER (same /exec URL)"
            echo "- Google Sheet: migrated automatically on the first visit (ensureInstalled_)"
            echo "- Sign-in page: GitHub Pages → https://ictsru.github.io/PR/"
          } >> "$GITHUB_STEP_SUMMARY"
